
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3 - Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Cadastro de Produto</h1>

        <form id="form-produto">
            <label for="nome">Nome do Produto:</label>
            <input type="text" id="nome" placeholder="Ex: Notebook">

            <label for="preco">Preço (R$):</label>
            <input type="number" id="preco" placeholder="Ex: 3500.00" step="0.01">

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" placeholder="Ex: 5" step="1">

            <button type="submit" class="adicionar" id="btn-salvar">
                Adicionar Produto
            </button>
        </form>

        <div class="linha">
            <h3>
                Total em Estoque:
                <span id="total-estoque">R$ 0,00</span>
            </h3>

            <button type="button" class="limpar" id="limpar-tabela">
                Limpar Tudo
            </button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço Un.</th>
                        <th>Qtd.</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
