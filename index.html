<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Desafio 3 - Gestão de Estoque</title>
    <link rel="stylesheet" href="style.css">
    
    </head> <body>
    <div class="container">
    
        <h1>Cadastro de Produto</h1>
    
        <label>Nome do Produto:</label>
        <input type="text" id="nome" placeholder="Ex: Notebook">
    
        <label>Preço (R$):</label>
        <input type="number" id="preco" placeholder="Ex: 3500.00">
    
        <label>Quantidade:</label>
        <input type="number" id="quantidade" placeholder="Ex: 5">
    
        <button class="adicionar" onclick="adicionarProduto()">
            Adicionar Produto
        </button>
    
        <div class="linha">
    
            <h3>
                Total em Estoque:
                <span id="total-estoque">R$ 0,00</span>
            </h3>
    
            <button class="limpar" id="limpar-tabela">
                Limpar Tudo
            </button>
    
        </div>
    
        <table>
    
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
    
            <tbody id="tabela-produtos"></tbody>
    
        </table>
    
    </div>
    
    <script src="script.js"></script>
    
    </body> </html>
