<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 3 - Gestão de Estoque</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #222;
            margin-top: 0;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .adicionar {
            width: 100%;
            padding: 7px;
            margin-top: 9px;
            border: none;
            border-radius: 3px;
            background-color: #2864e8;
            color: white;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .adicionar:hover {
            background-color: #174fc7;
        }

        .linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }

        .linha h3 {
            font-size: 12px;
            margin: 0;
        }

        .limpar {
            width: auto;
            background-color: #e62b32;
            color: white;
            padding: 7px 12px;
            border: none;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .limpar:hover {
            background-color: #c91f26;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 11px;
        }

        th {
            background-color: #2864e8;
            color: white;
            padding: 7px;
        }

        td {
            padding: 7px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .remover {
            background-color: #e62b32;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 5px 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .remover:hover {
            background-color: #c91f26;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cadastro de Produto</h1>

        <label>Nome do Produto:</label>
        <input type="text" id="nome" placeholder="Ex: Notebook">

        <label>Preço (R$):</label>
        <input type="number" id="preco" placeholder="Ex: 3500.00">

        <label>Quantidade:</label>
        <input type="number" id="quantidade" placeholder="Ex: 5">

        <button class="adicionar" onclick="adicionarProduto()">
            Adicionar Produto
        </button>

        <div class="linha">

            <h3>
                Total em Estoque:
                <span id="total-estoque">R$ 0,00</span>
            </h3>

            <button class="limpar" id="limpar-tabela">
                Limpar Tudo
            </button>

        </div>

        <table>

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabela-produtos"></tbody>

        </table>

    </div>

    <script>

        let listaDeProdutos = [];

        function adicionarProduto() {

            let nome = document.getElementById("nome").value;
            let preco = Number(document.getElementById("preco").value);
            let quantidade = Number(document.getElementById("quantidade").value);

            if (nome === "" || preco <= 0 || quantidade <= 0) {
                alert("Preencha todos os campos corretamente!");
                return;
            }

            let produto = {
                nome: nome,
                preco: preco,
                quantidade: quantidade,
                subtotal: preco * quantidade
            };

            listaDeProdutos.push(produto);

            document.getElementById("nome").value = "";
            document.getElementById("preco").value = "";
            document.getElementById("quantidade").value = "";

            atualizarTabela();
        }

        function atualizarTabela() {

            let tabela = document.getElementById("tabela-produtos");

            tabela.innerHTML = "";

            listaDeProdutos.forEach(function(produto, index) {

                tabela.innerHTML += `
                    <tr>
                        <td>${produto.nome}</td>
                        <td>R$ ${produto.preco.toFixed(2)}</td>
                        <td>${produto.quantidade}</td>
                        <td>R$ ${produto.subtotal.toFixed(2)}</td>
                        <td>
                            <button 
                                class="remover"
                                onclick="removerProduto(${index})">
                                Remover
                            </button>
                        </td>
                    </tr>
                `;

            });

            atualizarTotalEstoque();
        }

        function atualizarTotalEstoque() {

            let total = listaDeProdutos.reduce(function(acumulador, produto) {
                return acumulador + produto.subtotal;
            }, 0);

            document.getElementById("total-estoque").textContent =
                total.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL"
                });
        }

        function removerProduto(index) {

            listaDeProdutos.splice(index, 1);

            atualizarTabela();
        }

        document.getElementById("limpar-tabela").addEventListener("click", function() {

            listaDeProdutos.length = 0;

            atualizarTabela();

        });

    </script>

</body>
</html>
